<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 330px; font-family: system-ui, -apple-system, sans-serif; padding: 14px; background: #0b0f17; color: #e6edf3; margin: 0; box-sizing: border-box; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .header h3 { margin: 0; font-size: 17px; color: #38bdf8; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .header h3 img { width: 18px; height: 18px; }
    .badge { font-size: 11px; background: #1e293b; color: #38bdf8; padding: 3px 10px; border-radius: 99px; font-weight: 700; border: 1px solid #1e293b; }
    
    .hero-btn {
      width: 100%; padding: 12px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, #0284c7, #38bdf8); color: #082f49;
      font-weight: 800; font-size: 13.5px; cursor: pointer; margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.25); transition: 0.15s;
    }
    .hero-btn:hover { filter: brightness(1.08); }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    button.tool {
      background: #161b22; color: #e6edf3; border: 1px solid #30363d;
      padding: 10px 8px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.1s ease;
    }
    button.tool:hover { border-color: #38bdf8; background: #1f242c; }
    button.tool.active { background: #1f6feb; border-color: #58a6ff; color: #fff; }

    .section { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    .section-title { font-size: 10px; text-transform: uppercase; color: #9ca3af; margin-bottom: 8px; font-weight: 700; letter-spacing: 0.5px; }
    .swatches { display: flex; flex-wrap: wrap; gap: 6px; max-height: 72px; overflow-y: auto; padding-right: 4px; }
    .swatch { width: 25px; height: 25px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15); cursor: pointer; transition: transform 0.1s; }
    .swatch:hover { transform: scale(1.05); }
    .fonts { font-size: 12px; color: #c9d1d9; line-height: 1.5; font-family: monospace; white-space: pre-wrap; word-break: break-word; }
    #statusMsg { font-size: 11px; color: #4ade80; text-align: center; min-height: 14px; font-weight: 600; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h3>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align: middle;">
        <circle cx="12" cy="12" r="10" fill="#0284c7"/>
        <circle cx="12" cy="7" r="1.5" fill="#ffffff"/>
        <path d="M10.5 11h2v6.5h1.5M10.5 11h-1" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      </svg>
      StyleSnatch Pro
    </h3>
    <span class="badge">Dev Toolkit</span>
  </div>

  <button class="hero-btn" id="launchInspectorBtn">Inspect &amp; Copy Element CSS / Layout</button>

  <div class="grid">
    <button class="tool" id="xrayBtn">CSS Layout X-Ray</button>
    <button class="tool" id="editPageBtn">Live Text Edit</button>
    <button class="tool" id="scanAssetsBtn">Colors &amp; Fonts</button>
    <button class="tool" id="measureBtn">Page Tech Info</button>
  </div>

  <div class="section" id="paletteBox" style="display:none;">
    <div class="section-title">Extracted Colors (Click to Copy HEX)</div>
    <div class="swatches" id="swatchList"></div>
    <div class="section-title" style="margin-top:10px;">Detected Fonts</div>
    <div class="fonts" id="fontList"></div>
  </div>

  <div class="section" id="techBox" style="display:none;">
    <div class="section-title">DOM &amp; Viewport Diagnostics</div>
    <div class="fonts" id="techInfo"></div>
  </div>

  <div id="statusMsg"></div>

  <script src="popup.js"></script>
</body>
</html>
